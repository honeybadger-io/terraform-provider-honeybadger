openapi: 3.1.0
info:
  title: Widgets
  version: "1"
paths:
  "/projects/{project_id}/widgets":
    parameters:
    - "$ref": "#/components/parameters/ProjectId"
    get:
      operationId: listWidgets
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Widget"
    post:
      operationId: createWidget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WidgetCreateInput"
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Widget"
                  meta:
                    type: object
  "/projects/{project_id}/widgets/{widget_id}":
    parameters:
    - "$ref": "#/components/parameters/ProjectId"
    - name: widget_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getWidget
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Widget"
    patch:
      operationId: updateWidget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WidgetUpdateInput"
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Widget"
    delete:
      operationId: deleteWidget
      responses:
        '204':
          description: deleted
  "/projects/{project_id}/gadgets":
    parameters:
    - "$ref": "#/components/parameters/ProjectId"
    post:
      operationId: createGadget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GadgetCreateInput"
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Gadget"
  "/projects/{project_id}/gadgets/{gadget_id}":
    parameters:
    - "$ref": "#/components/parameters/ProjectId"
    - name: gadget_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getGadget
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Gadget"
    patch:
      operationId: updateGadget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GadgetUpdateInput"
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Gadget"
    delete:
      operationId: deleteGadget
      responses:
        '204':
          description: deleted
  "/sprockets":
    post:
      operationId: createSprocket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SprocketCreateInput"
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Sprocket"
  "/sprockets/{sprocket_id}":
    parameters:
    - name: sprocket_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getSprocket
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Sprocket"
    patch:
      operationId: updateSprocket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SprocketInput"
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Sprocket"
    delete:
      operationId: deleteSprocket
      responses:
        '204':
          description: deleted
components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: The project's ID.
      schema:
        type: string
  schemas:
    Shape:
      type: string
      enum:
      - round
      - square
      default: round
      description: Referenced description that a property-level one overrides.
    Gear:
      type: object
      description: The widget's drive gear. Replaced whole on update.
      required:
      - kind
      - mesh
      properties:
        kind:
          type: string
          enum:
          - spur
          - helical
          description: Tooth profile.
        mesh:
          "$ref": "#/components/schemas/Mesh"
    Mesh:
      type: object
      required:
      - teeth
      - pitch
      properties:
        teeth:
          type: integer
          minimum: 1
          description: Number of teeth.
        pitch:
          type: number
          description: Tooth spacing in millimetres.
    Widget:
      type: object
      description: A widget in a project.
      required:
      - id
      - project_id
      - name
      properties:
        id:
          type: string
          readOnly: true
          description: Unique identifier
        project_id:
          type: string
          readOnly: true
          description: The project this widget belongs to
        name:
          type: string
          description: The widget's name
        shape:
          description: How the widget looks.
          allOf:
          - "$ref": "#/components/schemas/Shape"
        size:
          type:
          - integer
          - 'null'
          description: Size in centimetres
        color:
          type:
          - string
          - 'null'
          description: The widget's color
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Labels
        badges:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Badges awarded
        events:
          type: array
          items:
            type: string
            enum:
            - spun
            - stopped
          description: Events to notify on
        gear:
          description: The widget's drive gear.
          anyOf:
          - "$ref": "#/components/schemas/Gear"
          - type: 'null'
        parts:
          type:
          - array
          - 'null'
          uniqueItems: true
          items:
            type: string
          description: Part numbers fitted
        archived:
          type: boolean
          description: Whether the widget is archived
        period:
          type:
          - string
          - 'null'
          description: How often it spins
        serial:
          type: string
          description: Factory serial number
        token:
          type: string
          format: password
          readOnly: true
          description: Credential for the widget
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When it was made
        links:
          type: object
          readOnly: true
          properties:
            web:
              type: string
    WidgetInput:
      type: object
      properties:
        name:
          type: string
          description: Widget name. Send null to clear.
        shape:
          description: How the widget looks. Send null to reset to `round`.
          allOf:
          - "$ref": "#/components/schemas/Shape"
        size:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 500
          description: Size in centimetres. Send null to clear.
        color:
          description: The widget's color, as a hex code.
          oneOf:
          - type: string
            pattern: "^#[0-9a-f]{6}$"
          - type: 'null'
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Labels on the widget.
        badges:
          type: array
          items:
            type: string
          description: Badges awarded to the widget.
        events:
          type: array
          items:
            type: string
            enum:
            - spun
            - stopped
          description: Events to notify on.
        gear:
          "$ref": "#/components/schemas/Gear"
        parts:
          type:
          - array
          - 'null'
          minItems: 1
          maxItems: 10
          items:
            type: string
          description: Part numbers fitted. Left out on create, every stocked part.
        period:
          type:
          - string
          - 'null'
          description: How often it spins, such as `5 minutes`.
        secret:
          type:
          - string
          - 'null'
          format: password
          writeOnly: true
          description: Webhook signing secret.
    WidgetUpdateInput:
      allOf:
      - "$ref": "#/components/schemas/WidgetInput"
      - type: object
        properties:
          archived:
            type: boolean
            description: Archive or unarchive the widget.
    WidgetCreateInput:
      allOf:
      - "$ref": "#/components/schemas/WidgetInput"
      - type: object
        required:
        - name
        - gear
        properties:
          serial:
            type: string
            maxLength: 32
            description: Factory serial number, set once.
          note:
            type: string
            description: A note kept only at creation.
          quiet:
            type: boolean
            writeOnly: true
            description: Create without notifying anyone. Not stored.
    GadgetEvent:
      type: string
      enum:
      - spun
      - stopped
      - jammed
    GadgetFilter:
      type: object
      required:
      - event
      - query
      properties:
        event:
          type: string
          enum:
          - spun
          - all
        query:
          type: string
          minLength: 1
    GadgetLinks:
      type: object
      readOnly: true
      required:
      - web
      properties:
        web:
          type: string
          description: The gadget's page
    GadgetConfigAlpha:
      type: object
      properties:
        url:
          type:
          - string
          - 'null'
          description: Where to send.
        token:
          type:
          - string
          - 'null'
          format: password
          writeOnly: true
          description: Signing secret.
    GadgetConfigBeta:
      type: object
      properties:
        mode:
          type:
          - string
          - 'null'
          default: fast
          description: How it runs.
    Gadget:
      type: object
      description: A gadget.
      required:
      - id
      - project_id
      - type
      properties:
        id:
          type: string
          readOnly: true
        project_id:
          type: string
          readOnly: true
        type:
          type: string
        active:
          type: boolean
          description: Whether the gadget runs.
        events:
          type: array
          uniqueItems: true
          items:
            type: string
        spot_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        filters:
          type: array
          items:
            "$ref": "#/components/schemas/GadgetFilter"
        config:
          type: object
          additionalProperties: true
        links:
          "$ref": "#/components/schemas/GadgetLinks"
    GadgetUpdateInput:
      type: object
      properties:
        active:
          type: boolean
        events:
          type:
          - array
          - 'null'
          items:
            "$ref": "#/components/schemas/GadgetEvent"
        spot_ids:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
        filters:
          type:
          - array
          - 'null'
          items:
            "$ref": "#/components/schemas/GadgetFilter"
        config:
          type: object
          additionalProperties: true
    GadgetCreateInput:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - Alpha
          - Beta
          - Gamma
        active:
          type: boolean
        events:
          type:
          - array
          - 'null'
          items:
            "$ref": "#/components/schemas/GadgetEvent"
        spot_ids:
          type:
          - array
          - 'null'
          default: []
          items:
            type: string
            format: uuid
        filters:
          type:
          - array
          - 'null'
          default: []
          items:
            "$ref": "#/components/schemas/GadgetFilter"
        config:
          type: object
          additionalProperties: true
      allOf:
      - if:
          properties:
            type:
              const: Alpha
          required:
          - type
        then:
          description: An alpha gadget, which posts to a URL.
          required:
          - config
          properties:
            config:
              "$ref": "#/components/schemas/GadgetConfigAlpha"
              required:
              - url
            events:
              items:
                enum:
                - spun
                - stopped
            active:
              default: true
      - if:
          properties:
            type:
              const: Beta
          required:
          - type
        then:
          properties:
            config:
              "$ref": "#/components/schemas/GadgetConfigBeta"
            active:
              default: true
      - if:
          properties:
            type:
              const: Gamma
          required:
          - type
        then:
          properties:
            config:
              "$ref": "#/components/schemas/GadgetConfigBeta"
            events:
              maxItems: 0
            active:
              default: false
    Sprocket:
      type: object
      description: A sprocket.
      required:
      - id
      - name
      - parent_id
      - speed
      - mode
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          description: The sprocket this one hangs from.
        headers:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
            format: password
          description: Headers sent with each turn.
        speed:
          "$ref": "#/components/schemas/SprocketSpeed"
        mode:
          "$ref": "#/components/schemas/SprocketMode"
        checked_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When it was last checked; null for one never checked.
    SprocketInput:
      type: object
      properties:
        name:
          type: string
        headers:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
            format: password
          default: {}
          description: Headers sent with each turn. Replaces the stored headers.
        speed:
          description: Turns a minute. Send null to reset to 5.
          default: 5
          anyOf:
          - "$ref": "#/components/schemas/SprocketSpeed"
          - type: 'null'
        mode:
          description: How it turns. Send null to reset to slow.
          default: slow
          anyOf:
          - "$ref": "#/components/schemas/SprocketMode"
          - type: 'null'
    SprocketCreateInput:
      allOf:
      - "$ref": "#/components/schemas/SprocketInput"
      - type: object
        required:
        - name
        - parent_id
        properties:
          parent_id:
            type: string
            format: uuid
            description: The sprocket this one hangs from.
    SprocketSpeed:
      type: integer
      enum:
      - 1
      - 2
      - 5
      - 15
      description: Turns a minute.
    SprocketMode:
      type: string
      enum:
      - slow
      - fast
