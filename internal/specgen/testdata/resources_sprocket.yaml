provider: honeybadger
resources:
  sprocket:
    create: createSprocket
    read: getSprocket
    update: updateSprocket
    delete: deleteSprocket
    import: "<id>"
    service: Sprockets
    api:
      model: Sprocket
      create_params: SprocketCreateParams
      update_params: SprocketUpdateParams
    find_hint: the account's sprockets
    custom_types: {gizmos: json_subset}
    json_required_keys: {gizmos: [id]}
