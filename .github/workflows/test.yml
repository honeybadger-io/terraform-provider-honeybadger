name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: go build -v ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          install-mode: goinstall
      - name: Docs are current
        run: |
          go generate ./...
          git diff --exit-code

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: go test -v -cover ./...
