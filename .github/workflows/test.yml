name: Tests

# Manual only until a release bumps go.mod to a pushed api-go: CI can't see the
# local api-go this provider develops against (spec sections 3.2 and 8.4).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: go build -v ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          install-mode: goinstall
      - name: Generated code is current
        run: |
          make generate
          git status --porcelain
          test -z "$(git status --porcelain)"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: go test -v -cover ./...
