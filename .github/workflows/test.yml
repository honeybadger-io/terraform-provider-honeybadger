name: Tests

# Builds against the api-go pinned in go.mod (GOWORK=off). A pull request that
# needs unreleased api-go pins its commit; see CONTRIBUTING.md. release.yml
# also calls it, so a tag only publishes after these jobs pass.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: go build -v ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          install-mode: goinstall
      - name: Generated code is current
        run: |
          make generate
          git status --porcelain
          test -z "$(git status --porcelain)"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: go test -v -cover ./...
