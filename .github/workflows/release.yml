name: Release

# Builds, signs and publishes a GitHub release when a v* tag is pushed. The
# Terraform Registry picks up signed releases from there. .goreleaser.yml
# describes the artifacts.
on:
  push:
    tags:
      - "v*"

# Creating a release and uploading its assets needs write access to contents.
permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  goreleaser:
    needs: test
    # The signing key lives in this environment, which only v* tags can use.
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser reads earlier tags.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
